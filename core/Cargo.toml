[package]
name = "replica-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
replica-sqlite = { path = "../sqlite" }
hop-types = { package = "types", git = "https://github.com/xinix00/hop.git", tag = "v3.2.0-rc8" }
leancrypto = { git = "https://github.com/xinix00/lean.git", tag = "v3.2.0-rc3" }
hop-discovery = { package = "discovery", git = "https://github.com/xinix00/hop.git", tag = "v3.2.0-rc8" }
[features]
# `host::{Dir, DirLease}`: objectstore en lease in een lokale map (std), en
# `replica_sqlite::host::Dir` als opslag; voor ontwikkeling en tests.
std = ["replica-sqlite/std"]
[dev-dependencies]
replica-core = { path = ".", features = ["std"] }
[lints]
workspace = true
