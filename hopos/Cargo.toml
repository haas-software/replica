[package]
name = "replica-hopos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
replica-sqlite = { path = "../sqlite" }
replica-core = { path = "../core" }
replica-s3 = { path = "../s3" }
applib = { git = "https://github.com/xinix00/HopOS.git", tag = "v3.0.13", features = ["http"] }
# Dezelfde Lean-tag als applib, zodat `TcpConn` en leanhttp één `Dial` kennen.
leanhttp = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12" }
leanhttps = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12", features = ["mozilla-roots"] }
leantls = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12", features = ["mozilla-roots"] }
leans3 = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12" }
leans3http = { git = "https://github.com/xinix00/lean.git", tag = "v3.1.12" }
[dev-dependencies]
replica-sqlite = { path = "../sqlite", features = ["std"] }
[lints]
workspace = true
