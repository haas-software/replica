[package]
name = "replica-hopos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
replica-sqlite = { path = "../sqlite" }
replica-core = { path = "../core" }
replica-s3 = { path = "../s3" }
applib = { git = "https://github.com/hop-os/HopOS.git", tag = "v3.2.0", features = ["http"] }
# `select` en `yield_now` van de banen (`lanes`); dezelfde tag als applib.
hopsync = { package = "sync", git = "https://github.com/hop-os/HopOS.git", tag = "v3.2.0" }
# Dezelfde Lean-tag als applib, zodat `TcpConn` en leanhttp één `Dial` kennen.
leanhttp = { git = "https://github.com/haas-software/lean.git", tag = "v3.2.0" }
leanhttps = { git = "https://github.com/haas-software/lean.git", tag = "v3.2.0", features = ["mozilla-roots"] }
leantls = { git = "https://github.com/haas-software/lean.git", tag = "v3.2.0", features = ["mozilla-roots"] }
leans3 = { git = "https://github.com/haas-software/lean.git", tag = "v3.2.0" }
leans3http = { git = "https://github.com/haas-software/lean.git", tag = "v3.2.0" }
[dev-dependencies]
replica-sqlite = { path = "../sqlite", features = ["std"] }
[lints]
workspace = true
